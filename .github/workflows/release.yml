name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: macOS Apple Silicon
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: macOS Intel
          - platform: 'ubuntu-22.04'
            args: ''
            name: Linux
          - platform: 'windows-latest'
            args: ''
            name: Windows

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable

      - name: Add macOS rust target
        if: matrix.name == 'macOS Apple Silicon'
        run: rustup target add aarch64-apple-darwin

      - name: Add macOS Intel rust target
        if: matrix.name == 'macOS Intel'
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-1 librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        with:
          tagName: v__VERSION__
          releaseName: 'Husk v__VERSION__'
          releaseBody: |
            See the full changelog in the release notes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
